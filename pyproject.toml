[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionkeep"
version = "0.1.0"
description = "Archive your AI coding agent (Claude Code, Codex, …) session logs with secret masking."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lug Works" }]
keywords = [
    "claude-code",
    "codex",
    "ai-agent",
    "llm",
    "logging",
    "secret-masking",
    "transcript",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []  # standard library only

[project.scripts]
sessionkeep = "sessionkeep.cli:main"

[project.urls]
Homepage = "https://github.com/lug-works/sessionkeep"
Repository = "https://github.com/lug-works/sessionkeep"
Issues = "https://github.com/lug-works/sessionkeep/issues"

# NOTE: add an email if you want it public, e.g. authors = [{ name = "Lug Works", email = "..." }]

[tool.hatch.build.targets.wheel]
packages = ["sessionkeep"]
